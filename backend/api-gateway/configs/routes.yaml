# ============================================================
# API Gateway — Декларативная конфигурация маршрутов
# ============================================================
# Движок не знает бизнес-логики. Все access-хендлеры (group_member,
# group_admin, character_writer и т.д.) — кастомные, определены
# в handlers/access.py.
# ============================================================

base_path: ""

auth:
  strategy: hybrid_jwt
  public_key_path: ${PUBLIC_KEY_PATH:-/certs/public.pem}
  expected_issuer: "${OIDC_ISSUER}"

services:
  auth:      { base_url: "${AUTH_SERVICE_URL}" }
  users:     { base_url: "${USERS_SERVICE_URL}" }
  campaign:  { base_url: "${CAMPAIGN_SERVICE_URL}" }

routes:

  # ============================================================
  # Local endpoints
  # ============================================================
  - path: /get_api
    methods: [GET]
    handler: get_api
    auth: none

  - path: /whoami
    methods: [GET]
    handler: whoami
    auth: required

  # ============================================================
  # Auth
  # ============================================================
  - path: /auth/register
    methods: [POST]
    proxy:
      service: auth
      path: /register
    auth: none

  - path: /auth/check
    methods: [GET]
    proxy:
      service: auth
      path: /check
    auth: none

  - path: /auth/reset-password/confirm
    methods: [POST]
    proxy:
      service: auth
      path: /reset-password/confirm
    auth: none

  - path: /auth/token
    methods: [POST]
    proxy:
      service: auth
      path: /token
    auth: none

  - path: /.well-known/jwks.json
    methods: [GET]
    proxy:
      service: auth
      path: /.well-known/jwks.json
    auth: none

  # ============================================================
  # Users
  # ============================================================
  - path: /users
    methods:
      GET:
        proxy:
          service: users
          path: /users
        auth: none
      POST:
        handler: user_create
        auth: required

  - path: /users/{user_id}
    proxy:
      service: users
      path: /users/{user_id}
    auth: required
    methods:
      GET: {}
      PATCH:
        access: self_only

  # ============================================================
  # Groups
  # ============================================================
  - path: /groups
    proxy:
      service: campaign
      path: /groups
      headers:
        X-Subject: "{state.x_subject}"
    auth: required
    params:
      query:
        userId: "{jwt.userId}"
    methods:
      GET:
        response:
          wrap: groups
      POST: {}

  - path: /groups/{group_id}
    proxy:
      service: campaign
      path: /groups/{group_id}
      headers:
        X-Subject: "{state.x_subject}"
    auth: required
    methods:
      GET:
        params:
          query:
            userId: "{jwt.userId}"
      PATCH: {}

  # ============================================================
  # Group Users (composite)
  # ============================================================
  - path: /groups/{group_id}/users
    methods: [GET]
    handler: group_users
    auth: required

  - path: /groups/{group_id}/users/{user_id}
    proxy:
      service: campaign
      path: /polices/groups
      headers:
        X-Subject: "{state.x_subject}"
    auth: required
    methods:
      PUT:
        params:
          body:
            groupId: "{path.group_id}"
            userId: "{path.user_id}"
      DELETE:
        params:
          query:
            groupId: "{path.group_id}"
            userId: "{path.user_id}"

  # ============================================================
  # Group Items
  # ============================================================
  - path: /groups/{group_id}/items
    proxy:
      service: campaign
      path: /groups/{group_id}/items
      headers:
        X-Subject: "{state.x_subject}"
    auth: required
    methods:
      GET:
        params:
          query:
            userId: "{jwt.userId}"
      POST: {}

  - path: /groups/{group_id}/items/{item_id}
    proxy:
      service: campaign
      path: /groups/{group_id}/items/{item_id}
      headers:
        X-Subject: "{state.x_subject}"
    auth: required
    params:
      query:
        userId: "{jwt.userId}"
    methods:
      GET: {}
      PUT: {}
      DELETE: {}

  # ============================================================
  # Group Notes
  # ============================================================
  - path: /groups/{group_id}/notes
    proxy:
      service: campaign
      path: /groups/{group_id}/notes
      headers:
        X-Subject: "{state.x_subject}"
    auth: required
    methods:
      GET:
        response:
          wrap: notes
        params:
          query:
            userId: "{jwt.userId}"
      POST: {}

  - path: /groups/{group_id}/notes/{note_id}
    proxy:
      service: campaign
      path: /groups/{group_id}/notes/{note_id}
      headers:
        X-Subject: "{state.x_subject}"
    auth: required
    methods:
      GET: {}
      PUT: {}
      DELETE: {}

  # ============================================================
  # Group Skills
  # ============================================================
  - path: /groups/{group_id}/skills/attributes
    proxy:
      service: campaign
      path: /groups/{group_id}/skills/attributes
      headers:
        X-Subject: "{state.x_subject}"
    auth: required
    methods:
      GET:
        params:
          query:
            userId: "{jwt.userId}"
      PUT: {}

  - path: /groups/{group_id}/skills
    proxy:
      service: campaign
      path: /groups/{group_id}/skills
      headers:
        X-Subject: "{state.x_subject}"
    auth: required
    methods:
      GET:
        params:
          query: "*"
      POST: {}

  - path: /groups/{group_id}/skills/{skill_id}
    proxy:
      service: campaign
      path: /groups/{group_id}/skills/{skill_id}
      headers:
        X-Subject: "{state.x_subject}"
    auth: required
    methods:
      GET:
        params:
          query:
            userId: "{jwt.userId}"
      PUT: {}
      DELETE: {}

  # ============================================================
  # Group Schemas
  # ============================================================
  - path: /groups/{group_id}/schemas/items
    proxy:
      service: campaign
      path: /schemas/groups/{group_id}/items
      headers:
        X-Subject: "{state.x_subject}"
    auth: required
    methods:
      GET:
        params:
          query:
            userId: "{jwt.userId}"
      PUT: {}

  - path: /groups/{group_id}/schemas/skills
    proxy:
      service: campaign
      path: /schemas/groups/{group_id}/skills
      headers:
        X-Subject: "{state.x_subject}"
    auth: required
    methods:
      GET:
        params:
          query:
            userId: "{jwt.userId}"
      PUT: {}

  - path: /groups/{group_id}/schemas/template
    proxy:
      service: campaign
      path: /schemas/groups/{group_id}/template
      headers:
        X-Subject: "{state.x_subject}"
    auth: required
    methods:
      GET:
        params:
          query:
            userId: "{jwt.userId}"
      PUT: {}

  - path: /groups/{group_id}/schemas/characters/resources
    proxy:
      service: campaign
      path: /schemas/groups/{group_id}/characters/resources
      headers:
        X-Subject: "{state.x_subject}"
    auth: required
    methods:
      GET:
        params:
          query:
            userId: "{jwt.userId}"
      PUT: {}

  # ============================================================
  # Export / Import
  # ============================================================
  - path: /groups/{group_id}/export
    methods: [GET]
    handler: group_export
    auth: required

  - path: /groups/{group_id}/import
    methods: [POST]
    handler: group_import
    auth: required

  # ============================================================
  # Group Quests
  # ============================================================
  - path: /groups/{group_id}/quests
    proxy:
      service: campaign
      path: /groups/{group_id}/quests
      headers:
        X-Subject: "{state.x_subject}"
    auth: required
    methods:
      GET:
        params:
          query:
            userId: "{jwt.userId}"
      POST: {}

  - path: /groups/{group_id}/quests/{quest_id}
    proxy:
      service: campaign
      path: /groups/{group_id}/quests/{quest_id}
      headers:
        X-Subject: "{state.x_subject}"
    auth: required
    methods:
      GET: {}
      PUT: {}
      PATCH:
        params:
          query:
            userId: "{jwt.userId}"
      DELETE: {}

  - path: /groups/{group_id}/characters/{character_id}/quests
    methods:
      GET:
        proxy:
          service: campaign
          path: /groups/{group_id}/quests
          headers:
            X-Subject: "{state.x_subject}"
        auth: required
        params:
          query:
            userId: "{jwt.userId}"
            characterId: "{path.character_id}"
      POST:
        handler: quest_create_for_character
        auth: required

  # ============================================================
  # Characters
  # ============================================================
  - path: /groups/{group_id}/characters
    proxy:
      service: campaign
      path: /groups/{group_id}/characters
      headers:
        X-Subject: "{state.x_subject}"
    auth: required
    methods:
      GET:
        params:
          query:
            userId: "{jwt.userId}"
      POST: {}

  - path: /groups/{group_id}/characters/{character_id}
    proxy:
      service: campaign
      path: /groups/{group_id}/characters/{character_id}
      headers:
        X-Subject: "{state.x_subject}"
    auth: required
    params:
      query:
        userId: "{jwt.userId}"
    methods:
      GET: {}
      PATCH: {}
      DELETE: {}

  # ============================================================
  # Character Users (composite)
  # ============================================================
  - path: /groups/{group_id}/characters/{character_id}/users
    methods: [GET]
    handler: character_users
    auth: required

  - path: /groups/{group_id}/characters/{character_id}/users/{user_id}
    auth: required
    methods:
      PUT:
        proxy:
          service: campaign
          path: /polices/groups/characters
          headers:
            X-Subject: "{state.x_subject}"
        params:
          body:
            groupId: "{path.group_id}"
            userId: "{path.user_id}"
            characterId: "{path.character_id}"
      DELETE:
        proxy:
          service: campaign
          path: /polices/groups
          headers:
            X-Subject: "{state.x_subject}"
        params:
          query:
            groupId: "{path.group_id}"
            userId: "{path.user_id}"
            characterId: "{path.character_id}"

  # ============================================================
  # Character Templates
  # ============================================================
  - path: /groups/{group_id}/characters/templates
    proxy:
      service: campaign
      path: /groups/{group_id}/characters/templates
      headers:
        X-Subject: "{state.x_subject}"
    auth: required
    methods:
      GET:
        params:
          query:
            userId: "{jwt.userId}"
      POST: {}
      PUT: {}

  - path: /groups/{group_id}/characters/templates/{template_id}
    proxy:
      service: campaign
      path: /groups/{group_id}/characters/templates/{template_id}
      headers:
        X-Subject: "{state.x_subject}"
    auth: required
    methods:
      GET:
        params:
          query:
            userId: "{jwt.userId}"
      PUT: {}

  # ============================================================
  # Character Items
  # ============================================================
  - path: /groups/{group_id}/characters/{character_id}/items
    proxy:
      service: campaign
      path: /groups/{group_id}/characters/{character_id}/items
      headers:
        X-Subject: "{state.x_subject}"
    auth: required
    params:
      query:
        userId: "{jwt.userId}"
    methods:
      GET: {}
      POST: {}

  - path: /groups/{group_id}/characters/{character_id}/items/{item_id}
    proxy:
      service: campaign
      path: /groups/{group_id}/characters/{character_id}/items/{item_id}
      headers:
        X-Subject: "{state.x_subject}"
    auth: required
    params:
      query:
        userId: "{jwt.userId}"
    methods:
      GET: {}
      PUT: {}
      DELETE: {}

  # ============================================================
  # Character Notes
  # ============================================================
  - path: /groups/{group_id}/characters/{character_id}/notes
    proxy:
      service: campaign
      path: /groups/{group_id}/characters/{character_id}/notes
      headers:
        X-Subject: "{state.x_subject}"
    auth: required
    methods:
      GET:
        response:
          wrap: notes
      POST: {}

  - path: /groups/{group_id}/characters/{character_id}/notes/{note_id}
    proxy:
      service: campaign
      path: /groups/{group_id}/characters/{character_id}/notes/{note_id}
      headers:
        X-Subject: "{state.x_subject}"
    auth: required
    methods:
      GET: {}
      PUT: {}
      DELETE: {}

  # ============================================================
  # Character Skills
  # ============================================================
  - path: /groups/{group_id}/characters/{character_id}/skills
    methods:
      GET:
        proxy:
          service: campaign
          path: /groups/{group_id}/characters/{character_id}/skills
          headers:
            X-Subject: "{state.x_subject}"
        auth: required
        params:
          query: "*"

  - path: /groups/{group_id}/characters/{character_id}/skills/{skill_id}
    proxy:
      service: campaign
      path: /groups/{group_id}/characters/{character_id}/skills/{skill_id}
      headers:
        X-Subject: "{state.x_subject}"
      skip_body: true
    auth: required
    params:
      query:
        userId: "{jwt.userId}"
    methods:
      PUT: {}
      DELETE: {}

  # ============================================================
  # Character Equipment
  # ============================================================
  - path: /groups/{group_id}/characters/{character_id}/equipment
    proxy:
      service: campaign
      path: /groups/{group_id}/characters/{character_id}/equipment
      headers:
        X-Subject: "{state.x_subject}"
    auth: required
    params:
      query:
        userId: "{jwt.userId}"
    methods:
      GET: {}
      PATCH: {}
      PUT: {}

  # ============================================================
  # Character Commands
  # ============================================================
  - path: /groups/{group_id}/characters/{character_id}/commands
    proxy:
      service: campaign
      path: /groups/{group_id}/characters/{character_id}/commands
      headers:
        X-Subject: "{state.x_subject}"
    auth: required
    methods:
      POST: {}

  - path: /groups/{group_id}/characters/{character_id}/commands/batch
    proxy:
      service: campaign
      path: /groups/{group_id}/characters/{character_id}/commands/batch
      headers:
        X-Subject: "{state.x_subject}"
    auth: required
    methods:
      POST: {}

  # ============================================================
  # Character Log
  # ============================================================
  - path: /groups/{group_id}/characters/{character_id}/log
    methods: [GET]
    proxy:
      service: campaign
      path: /groups/{group_id}/characters/{character_id}/log
      headers:
        X-Subject: "{state.x_subject}"
    auth: required