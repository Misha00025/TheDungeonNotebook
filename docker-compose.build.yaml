# Independent image build catalog. This file intentionally defines no runtime setup.
services:
  api-gateway:
    build:
      context: ./apps/backend/api-gateway
      tags:
        - backend-api-gateway:latest
    image: backend-api-gateway:${IMAGE_TAG:-latest}
  auth-service:
    build:
      context: ./apps/backend/auth-service
      tags:
        - backend-auth-service:latest
    image: backend-auth-service:${IMAGE_TAG:-latest}
  users-service:
    build:
      context: ./apps/backend/users-service
      tags:
        - backend-users-service:latest
    image: backend-users-service:${IMAGE_TAG:-latest}
  campaign-service:
    build:
      context: ./apps/backend
      dockerfile: campaign-service/Dockerfile
      tags:
        - backend-campaign-service:latest
    image: backend-campaign-service:${IMAGE_TAG:-latest}
  game-systems-service:
    build:
      context: ./apps/backend
      dockerfile: game-systems-service/Dockerfile
      tags:
        - backend-game-systems-service:latest
    image: backend-game-systems-service:${IMAGE_TAG:-latest}
  sync-service:
    build:
      context: ./apps/backend/sync-service
      tags:
        - backend-sync-service:latest
    image: backend-sync-service:${IMAGE_TAG:-latest}
  admin-panel:
    build:
      context: ./apps/admin
      tags:
        - admin-admin-panel:latest
    image: admin-admin-panel:${IMAGE_TAG:-latest}
  web-hub:
    build:
      context: ./apps/web
      dockerfile: apps/hub/Dockerfile
      args:
        VITE_BASE: ${VITE_BASE_HUB:-/}
        VITE_REMOTE_CAMPAIGN: ${VITE_REMOTE_CAMPAIGN:-http://localhost:3000/assets/remoteEntry.js}
        VITE_REMOTE_GAME_SYSTEMS: ${VITE_REMOTE_GAME_SYSTEMS:-http://localhost:3001/assets/remoteEntry.js}
        VITE_REMOTE_PROFILE: ${VITE_REMOTE_PROFILE:-http://localhost:3002/assets/remoteEntry.js}
        VITE_REMOTE_LOGIN: ${VITE_REMOTE_LOGIN:-http://localhost:3003/assets/remoteEntry.js}
      tags:
        - tdn-hub:latest
    image: tdn-hub:${IMAGE_TAG:-latest}
  web-campaign:
    build:
      context: ./apps/web
      dockerfile: apps/campaign/Dockerfile
      args:
        VITE_BASE: ${VITE_BASE_CAMPAIGN:-/}
      tags:
        - tdn-campaign:latest
    image: tdn-campaign:${IMAGE_TAG:-latest}
  web-profile:
    build:
      context: ./apps/web
      dockerfile: apps/profile/Dockerfile
      args:
        VITE_BASE: ${VITE_BASE_PROFILE:-/}
      tags:
        - tdn-profile:latest
    image: tdn-profile:${IMAGE_TAG:-latest}
  web-login:
    build:
      context: ./apps/web
      dockerfile: apps/login/Dockerfile
      args:
        VITE_BASE: ${VITE_BASE_LOGIN:-/}
      tags:
        - tdn-login:latest
    image: tdn-login:${IMAGE_TAG:-latest}
  web-game-systems:
    build:
      context: ./apps/web
      dockerfile: apps/game-systems/Dockerfile
      args:
        VITE_BASE: ${VITE_BASE_GAME_SYSTEMS:-/}
      tags:
        - tdn-game-systems:latest
    image: tdn-game-systems:${IMAGE_TAG:-latest}
