services:
  campaign:
    build:
      context: .
      dockerfile: apps/campaign/Dockerfile
    image: tdn-campaign
    container_name: tdn-campaign
    restart: unless-stopped

  # game-systems — отключён (не используется). Раскомментировать при необходимости.
  # game-systems:
  #   build:
  #     context: .
  #     dockerfile: apps/game-systems/Dockerfile
  #     args:
  #       VITE_BASE: ${VITE_BASE_GAME_SYSTEMS:-/}
  #   image: tdn-game-systems
  #   container_name: tdn-game-systems
  #   ports:
  #     - "${GAME_SYSTEMS_PORT:-3001}:3000"
  #   restart: unless-stopped

  hub:
    build:
      context: .
      dockerfile: apps/hub/Dockerfile
    image: tdn-hub
    container_name: tdn-hub
    restart: unless-stopped

  profile:
    build:
      context: .
      dockerfile: apps/profile/Dockerfile
    image: tdn-profile
    container_name: tdn-profile
    restart: unless-stopped

  login:
    build:
      context: .
      dockerfile: apps/login/Dockerfile
    image: tdn-login
    container_name: tdn-login
    restart: unless-stopped

  nginx:
    build:
      context: ./proxy
    image: tdn-web-proxy:latest
    ports:
      - "${WEB_PORT:-3004}:80"
    environment:
      BFF_BASE: "${BFF_BASE:-http://localhost:5080/bff}"
      API_BASE: "${API_BASE:-}"
      WEB_BASE_PATH: "${WEB_BASE_PATH:-/}"
      WEB_CAMPAIGN_PATH: "${WEB_CAMPAIGN_PATH:-/remotes/campaign/}"
      WEB_PROFILE_PATH: "${WEB_PROFILE_PATH:-/remotes/profile/}"
      WEB_LOGIN_PATH: "${WEB_LOGIN_PATH:-/remotes/login/}"
      WEB_HUB_UPSTREAM: "${WEB_HUB_UPSTREAM:-http://hub:3000}"
      WEB_CAMPAIGN_UPSTREAM: "${WEB_CAMPAIGN_UPSTREAM:-http://campaign:3000}"
      WEB_PROFILE_UPSTREAM: "${WEB_PROFILE_UPSTREAM:-http://profile:3000}"
      WEB_LOGIN_UPSTREAM: "${WEB_LOGIN_UPSTREAM:-http://login:3000}"
      WEB_DNS_RESOLVER: "${WEB_DNS_RESOLVER:-127.0.0.11}"
    restart: unless-stopped
