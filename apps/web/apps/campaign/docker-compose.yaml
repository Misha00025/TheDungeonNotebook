# @tdn/campaign — отдельный контейнер.
# Запуск из КОРНЯ монорепо (context: ../..), т.к. приложение зависит от packages/shared:
#   cp template.env .env && docker compose -f apps/campaign/docker-compose.yaml up -d --build
services:
  campaign:
    build:
      context: ../..
      dockerfile: apps/campaign/Dockerfile
      args:
        VITE_BASE: ${VITE_BASE:-/}
    image: tdn-campaign
    container_name: tdn-campaign
    ports:
      - "${CAMPAIGN_PORT:-3000}:3000"
    env_file:
      - .env
    restart: unless-stopped
    # Чтобы подложить свой config.json (заменит ENV):
    # volumes:
    #   - ./config.json:/app/build/config.json:ro
