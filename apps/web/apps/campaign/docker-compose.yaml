# @tdn/campaign — отдельный контейнер.
# Запуск из корня apps/web для статической раздачи federation assets.
services:
  campaign:
    build:
      context: ../..
      dockerfile: apps/campaign/Dockerfile
      args:
        VITE_BASE: ${VITE_BASE:-/}
    image: tdn-campaign
    container_name: tdn-campaign
    ports:
      - "${CAMPAIGN_PORT:-3000}:3000"
    restart: unless-stopped
