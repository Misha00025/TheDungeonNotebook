version: '3'

services:
  mongo:
    image: mongo:latest
    container_name: mongo_db
    restart: always
    networks:
      - backend-network
    volumes:
      - ./mongo_data:/data/db
    env_file:
      - ./.env
    healthcheck:
      test: ["CMD", "echo", "db.runCommand(\"ping\").ok", "|", "mongosh", "mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@localhost:27017/?authSource=${MYSQL_DATABASE}", "--quiet"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  mysql:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    networks:
      - backend-network
    env_file:
      - ./.env
    volumes:
      - ./mysql_data:/var/lib/mysql
      - ./users-service/init-users.sh:/docker-entrypoint-initdb.d/1_users.sh
      - ./campaign-service/init-campaign.sh:/docker-entrypoint-initdb.d/2_campaign.sh
      - ./account-service/init-accounts.sh:/docker-entrypoint-initdb.d/3_accounts.sh
    healthcheck:
      test: ["CMD", "mysqladmin", "-u$$MYSQL_USER", "-p$$MYSQL_PASSWORD", "ping"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s

  users-service:
    build:
      context: .
      dockerfile: users-service/Dockerfile
    container_name: users-service
    depends_on:
      mongo:
        condition: service_healthy
      mysql:
        condition: service_healthy
    networks:
      - backend-network
    volumes:
      - ./logs:/logs
    env_file:
      - ./.env
    environment:
      - MONGO_CONNECTION_STRING=mongodb://$MONGO_INITDB_ROOT_USERNAME:$MONGO_INITDB_ROOT_PASSWORD@mongo:27017/
      - MYSQL_CONNECTION_STRING=server=mysql;database=$USERS_DATABASE;user=$MYSQL_USER;password=$MYSQL_PASSWORD;
      - INTERNAL_SERVICE_KEY=${INTERNAL_SERVICE_KEY:?INTERNAL_SERVICE_KEY is required}

  campaign-service:
    build:
      context: .
      dockerfile: campaign-service/Dockerfile
    container_name: campaign-service
    depends_on:
      mongo:
        condition: service_healthy
      mysql:
        condition: service_healthy
    networks:
      - backend-network
    volumes:
      - ./logs:/logs
    env_file:
      - ./.env
    environment:
      - MONGO_CONNECTION_STRING=mongodb://$MONGO_INITDB_ROOT_USERNAME:$MONGO_INITDB_ROOT_PASSWORD@mongo:27017/
      - MYSQL_CONNECTION_STRING=server=mysql;database=$CAMPAIGN_DATABASE;user=$MYSQL_USER;password=$MYSQL_PASSWORD;
      - INTERNAL_SERVICE_KEY=${INTERNAL_SERVICE_KEY:?INTERNAL_SERVICE_KEY is required}

  account-service:
    build:
      context: ./account-service
    container_name: account-service
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - backend-network
    volumes:
      - ./certs:/certs:ro
      - ./account-config:/run/account-config
    environment:
      - MYSQL_CONNECTION_STRING=server=mysql;database=${ACCOUNTS_DATABASE};user=${ACCOUNTS_MYSQL_USER};password=${ACCOUNTS_MYSQL_PASSWORD};
      - InternalAuth__ApiKey=${ACCOUNT_SERVICE_KEY:?ACCOUNT_SERVICE_KEY is required}
      - ACCOUNT_CONFIG=/run/account-config/accounts.json
      - ASPNETCORE_URLS=http://+:8080

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    depends_on:
      campaign-service:
        condition: service_started
      users-service:
        condition: service_started
      account-service:
        condition: service_started
    networks:
      - backend-network
    ports:
      - "5000:5000"
    env_file:
      - ./.env
    volumes:
      - ./certs:/certs:ro
      - ../../logs:/app/logs
    environment:
      - ACCOUNT_SERVICE_URL=${ACCOUNT_SERVICE_URL:-http://account-service:8080}
      - ACCOUNT_SERVICE_KEY=${ACCOUNT_SERVICE_KEY:?ACCOUNT_SERVICE_KEY is required}
      - INTERNAL_SERVICE_KEY=${INTERNAL_SERVICE_KEY:?INTERNAL_SERVICE_KEY is required}

  bff-web:
    build:
      context: ../bff/web
      dockerfile: Dockerfile
    image: tdn-bff-web:${IMAGE_TAG:-latest}
    depends_on:
      api-gateway:
        condition: service_started
      bff-redis:
        condition: service_started
    networks:
      - backend-network
      - bff-network
    ports:
      - "${BFF_PORT:-5080}:8080"
    volumes:
      - "${BFF_CONFIG_DIRECTORY:-../bff/web/data/config}:/app/config"
      - "${BFF_KEY_DIRECTORY:-../bff/web/data/keys}:/var/lib/tdn-bff/keys"
    environment:
      ASPNETCORE_URLS: http://+:8080
      Bff__Redis__ConnectionString: "${BFF_REDIS_CONNECTION_STRING:-bff-redis:6379,abortConnect=false}"
      Bff__DataProtection__KeyDirectory: /var/lib/tdn-bff/keys
      ReverseProxy__Clusters__gateway__Destinations__gateway__Address: "${BFF_GATEWAY_ADDRESS:-http://api-gateway:5000/}"

  bff-redis:
    image: redis:8.2-alpine
    command: ["redis-server", "--appendonly", "${BFF_REDIS_APPENDONLY:-yes}"]
    networks:
      - bff-network
    volumes:
      - "${BFF_REDIS_DATA_DIRECTORY:-../bff/web/data/redis}:/data"

networks:
  backend-network:
    driver: bridge
  bff-network:
    driver: bridge
