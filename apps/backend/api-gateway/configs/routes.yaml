# ============================================================
# API Gateway — Декларативная конфигурация маршрутов
# ============================================================
# Движок не знает бизнес-логики. Все access-хендлеры (group_member,
# group_admin, character_writer и т.д.) — кастомные, определены
# в handlers/access.py.
# ============================================================

base_path: ""

auth:
  strategy: account_service

services:
  account:      { base_url: "${ACCOUNT_SERVICE_URL}" }
  users:         { base_url: "${USERS_SERVICE_URL}" }
  campaign:      { base_url: "${CAMPAIGN_SERVICE_URL}" }

routes:

  # ============================================================
  # Local endpoints
  # ============================================================
  - path: /get_api
    methods: [GET]
    handler: get_api
    auth: none

  - path: /whoami
    methods: [GET]
    handler: whoami
    auth: required

  # ============================================================
  # Auth
  # ============================================================
  - path: /auth/register
    methods: [POST]
    handler: legacy_auth_unavailable
    auth: none

  - path: /auth/check
    methods: [GET]
    handler: legacy_auth_unavailable
    auth: none

  - path: /auth/reset-password/confirm
    methods: [POST]
    handler: legacy_auth_unavailable
    auth: none

  - path: /auth/token
    methods: [POST]
    handler: legacy_auth_unavailable
    auth: none

  - path: /.well-known/jwks.json
    methods: [GET]
    handler: legacy_auth_unavailable
    auth: none

  # ============================================================
  # Users
  # ============================================================
  - path: /users
    methods:
      GET:
        proxy:
          service: users
          path: /users
        pre_request_handler: trusted_upstream
        auth: none
      POST:
        handler: user_create
        auth: required

  - path: /users/{user_id}
    proxy:
      service: users
      path: /users/{user_id}
    pre_request_handler: trusted_upstream
    auth: required
    methods:
      GET: {}
      PATCH:
        access: self_only

  - path: /users/{user_id}/settings
    proxy:
      service: users
      path: /users/{user_id}/settings
    pre_request_handler: trusted_upstream
    auth: required
    methods:
      GET:
        access: self_only
      PUT:
        access: self_only
      DELETE:
        access: self_only

  - path: /api/campaigns/creation/{requestId}
    proxy:
      service: campaign
      path: /api/campaigns/creation/{requestId}
      headers:
        X-Subject: "{state.x_subject}"
    pre_request_handler: campaign_upstream
    response_handler: campaign_response
    auth: required
    methods: [GET]

  - path: /api/campaigns
    proxy:
      service: campaign
      path: /api/campaigns
      headers:
        X-Subject: "{state.x_subject}"
    pre_request_handler: campaign_upstream
    response_handler: campaign_response
    auth: required
    methods: [GET, POST]

