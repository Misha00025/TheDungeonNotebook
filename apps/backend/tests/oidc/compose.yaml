services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: accounts
      MYSQL_USER: accounts
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p\"$$MYSQL_ROOT_PASSWORD\" >/dev/null 2>&1"]
      interval: 3s
      timeout: 3s
      retries: 40

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 3s
      timeout: 3s
      retries: 40

  idp:
    image: quay.io/keycloak/keycloak:26.8.2
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABASE: ${IDP_DATABASE:-keycloak}
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HOSTNAME: http://idp:8080
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    volumes:
      - ${OIDC_SMOKE_DIR}/realms:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy

  account-service:
    build:
      context: ../../account-service
    environment:
      ASPNETCORE_URLS: http://+:8080
      MYSQL_CONNECTION_STRING: Server=mysql;Database=accounts;User=accounts;Password=${MYSQL_PASSWORD}
      InternalAuth__ApiKey: ${ACCOUNT_SERVICE_KEY}
      Oidc__Providers__0__Issuer: http://idp:8080/realms/smoke-a
      Oidc__Providers__0__Audiences__0: tdn-smoke-api
      Oidc__Providers__0__ValidHeaderTypes__0: JWT
      Oidc__Providers__0__AccessTokenTypeClaim: typ
      Oidc__Providers__0__AccessTokenTypeValues__0: Bearer
      Oidc__Providers__0__AllowHttpForDevelopment: "true"
      Oidc__Providers__1__Issuer: http://idp:8080/realms/smoke-b
      Oidc__Providers__1__Audiences__0: tdn-smoke-api
      Oidc__Providers__1__ValidHeaderTypes__0: JWT
      Oidc__Providers__1__AccessTokenTypeClaim: typ
      Oidc__Providers__1__AccessTokenTypeValues__0: Bearer
      Oidc__Providers__1__AllowHttpForDevelopment: "true"
      LegacyGroups__Enabled: "false"
      Accounts__FirstAccountId: "1"
    depends_on:
      mysql:
        condition: service_healthy

  upstream:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "upstream.py"]
    environment:
      OIDC_SMOKE_DIR: /fixtures
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
    volumes:
      - ${OIDC_SMOKE_DIR}:/fixtures

  api-gateway:
    build:
      context: ../../api-gateway
    environment:
      APP_CONFIG: /app/configs/app.json
      ACCOUNT_SERVICE_KEY: ${ACCOUNT_SERVICE_KEY}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
      ACCOUNT_SERVICE_URL: http://account-service:8080
      USERS_SERVICE_URL: http://upstream:8080
      CAMPAIGN_SERVICE_URL: http://upstream:8080
      AUTH_SERVICE_URL: http://upstream:8080
    depends_on:
      - account-service
      - upstream

  runner:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      OIDC_SMOKE_DIR: /fixtures
      OIDC_ISSUER_A: http://idp:8080/realms/smoke-a
      OIDC_ISSUER_B: http://idp:8080/realms/smoke-b
      ACCOUNT_SERVICE_URL: http://account-service:8080
      GATEWAY_URL: http://api-gateway:5000
      UPSTREAM_URL: http://upstream:8080
      CLIENT_SECRET: ${CLIENT_SECRET}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SMOKE_PASSWORD: ${SMOKE_PASSWORD}
      ACCOUNT_SERVICE_KEY: ${ACCOUNT_SERVICE_KEY}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - ${OIDC_SMOKE_DIR}:/fixtures
    depends_on:
      - idp
      - account-service
      - api-gateway
      - upstream

volumes:
  mysql_data:
  postgres_data:
