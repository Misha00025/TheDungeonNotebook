name: tdn-keycloak-local

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run the Keycloak setup script first}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - keycloak_local

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: ["start", "--import-realm"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?Run the Keycloak setup script first}
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Run the Keycloak setup script first}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: ${KEYCLOAK_URL:?Run the Keycloak setup script first}
      KC_HEALTH_ENABLED: "true"
      KC_CACHE: local
    ports:
      - "${KEYCLOAK_BIND_ADDRESS:-0.0.0.0}:8180:8080"
    mem_limit: 2g
    volumes:
      - ./import:/opt/keycloak/data/import:ro
      - ./themes:/opt/keycloak/themes:ro
    healthcheck:
      test:
        - CMD
        - /bin/bash
        - -c
        - exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.0\r\n\r\n' >&3; IFS= read -r status <&3; [[ "$${status}" == *" 200 "* ]]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - keycloak_local

networks:
  keycloak_local:
    driver: bridge
